name: Nightly release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:nightly" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nightly image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}

      - name: Update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          commit=$(git rev-parse HEAD)
          git tag -f nightly "$commit"
          git push origin refs/tags/nightly --force
          notes="Nightly build of commit $commit. Docker image: ghcr.io/${GITHUB_REPOSITORY,,}:nightly"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "Nightly release" --notes "$notes" --prerelease
          else
            gh release create nightly --title "Nightly release" --notes "$notes" --prerelease
          fi
